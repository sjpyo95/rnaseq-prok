samples: config/example/samples.csv
outdir:  results/example

# ─────────────────────────────────────────────────────────────
#  FILL IN THESE PATHS FOR YOUR DATASET
# ─────────────────────────────────────────────────────────────
genome:           /path/to/reference/genome.fa
annotation_gtf:   /path/to/reference/annotation.gtf
annotation_gff:   ""        # leave empty if not available
annotation_bed12: ""        # required only when strandedness: unknown

# HISAT2 index prefix (pre-built; run `snakemake hisat2_build` if missing)
hisat2_index: /path/to/hisat2/index/prefix
# ─────────────────────────────────────────────────────────────

# Threads (adjust to your machine)
threads:
  fastqc: 4
  fastp: 4
  hisat2: 8
  samtools: 8
  featurecounts: 4

# Step 1 & 3: FastQC
fastqc:
  extra: ""

# Step 2: fastp (paired-end)
fastp:
  trim_poly_g: true
  poly_g_min_len: 10
  cut_right: true
  cut_right_window_size: 4
  cut_right_mean_quality: 20
  length_required: 30
  extra: ""

# Step 4: Strandedness inference (applies to samples with strandedness: unknown)
strandedness_inference:
  subsample_reads: 500000
  min_fraction: 0.7
  hisat2_extra: "--dta --no-spliced-alignment"

# Step 5: Alignment
hisat2:
  extra: "--dta --no-spliced-alignment"

# Step 6: featureCounts
featurecounts:
  feature_type: "CDS"
  attribute: "gene_id"
  paired: true
  multi_overlap: false
  extra: ""

# Step 7: Batch correction (optional)
batch_correction:
  enabled: false
  batch_column: "batch"

# Step 8: DESeq2
deg:
  reference_condition: "ctrl"   # must match a condition name in samples.csv
  padj_cutoff: 0.05
  lfc_cutoff: 1.0
